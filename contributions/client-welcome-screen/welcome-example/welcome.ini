[welcome]
enabled=true
title=Welcome to your library
subtitle=Discover. Learn. Connect.
; Relative paths resolve beside this file. No image download is performed.
images=images/winter.png, images/riverfront.png, images/garden.png
; 0 keeps the first picture; 5-86400 seconds rotates. Default: 180.
rotation_seconds=180
; Optional relative path to your logo:
logo=
style_file=welcome.qss
; Exact HTTPS origins only. Empty disables online links.
allowed_origins=https://library.example.org

[resources]
size=4
1\title=FAQ
1\icon=icons/faq.svg
1\content_file=policies/faq.html
2\title=Computer policies
2\icon=icons/computer.svg
2\content_file=policies/computers.html
3\title=Library cards
3\icon=icons/card.svg
3\content_file=policies/cards.html
4\title=Printing policies
4\icon=icons/print.svg
4\content_file=policies/printing.html
; A tile can use an approved HTTPS url instead of content_file:
; 4\url=https://library.example.org/printing
